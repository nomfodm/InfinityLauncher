name: Wails build MANDATORY

on:
  push:
    tags:
      - 'v*.*.*-m'
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'InfinityLauncher.exe'
            platform: 'windows/amd64'
            os: 'windows-latest'
          # - name: 'InfinityLauncher'
          #   platform: 'linux/amd64'
          #   os: 'ubuntu-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set version from tag
        uses: LSVH/gha-replace-placeholders@v1
        with:
          include: |
            wails.json
          placeholders: |
            %infinitylauncher%VERSION%=${{ github.ref_name }}

      - name: Build wails
        uses: dAppServer/wails-build-action@main
        id: build
        with:
          wails-version: "v2.10.2"
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          nsis: false
          go-version: '1.25.1'
          package: false

      - name: Generate SHA256
        if: runner.os != 'Windows'
        run: |
          cd build/bin
          sha256sum ${{ matrix.build.name }} > ${{ matrix.build.name }}.sha256

      - name: Generate SHA256
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-FileHash build\bin\${{ matrix.build.name }} -Algorithm SHA256 |
            ForEach-Object { "{0}" -f $_.Hash.ToLower() } |
            Out-File build\bin\${{ matrix.build.name }}.sha256 -Encoding ascii
          
          $hash = (Get-FileHash build\bin\${{ matrix.build.name }} -Algorithm SHA256).Hash.ToLower()
          "APP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Upload to S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET}}
          aws_bucket: ${{ secrets.AWS_BUCKET_NAME }}
          endpoint: ${{ secrets.AWS_URL }}
          source_dir: 'build/bin'
          destination_dir: "launcher/${{ env.APP_SHA256 }}"

      - name: Register version in API
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          UPLOAD_URL=${{ secrets.STORAGE_URL }}/launcher/${{ env.APP_SHA256 }}/${{ matrix.build.name }}
          curl -X POST ${{ secrets.API_REGISTER_UPDATE_URL }} \
            -H "Authorization: ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "'"$VERSION"'",
              "downloadUrl": "'$UPLOAD_URL'",
              "sha256": "${{ env.APP_SHA256 }}",
              "mandatory": true
            }'
